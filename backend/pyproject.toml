[project]
name = "construction-erp-backend"
version = "0.1.0"
description = "Construction ERP backend — FastAPI + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "uuid-utils>=0.9",
    "python-multipart>=0.0.17",
    "email-validator>=2.2",
    "anthropic>=0.120.2",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "faker>=33.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP046"]  # B008: FastAPI Depends() in defaults; UP046: keep Generic[T] for Pydantic

[tool.ruff.lint.per-file-ignores]
"scripts/seed.py" = ["E501"]  # tabular seed data reads better unwrapped
"alembic/versions/*.py" = ["E501", "UP", "I001"]  # autogenerated migration files

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
